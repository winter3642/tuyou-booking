# CI：push/PR 跑全量测试（MySQL+Redis 服务依赖）→ 通过后构建镜像推 GHCR
# 踩坑备忘：CI 的 MySQL 没有 tuyou 用户 → application-test.yml 已支持 TEST_DB_USER 环境变量覆盖；
#           Redis 必须带本地同款密码 tuyou123，否则测试连不上
name: CI
on:
  push: { branches: [main] }
  pull_request:
# GHCR 推送需要显式 packages: write（默认只读，否则 "Create organization package denied"）
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tuyou_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        command: redis-server --requirepass tuyou123   # 必须与本地同款密码，缺了测试必红
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli -a tuyou123 ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B test jacoco:report
        env:
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with: { push: true, tags: ghcr.io/winter3642/tuyou-booking:latest }
